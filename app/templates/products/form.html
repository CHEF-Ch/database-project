{% extends "base.html" %}
{% block title %}{% if product %}编辑商品{% else %}新增商品{% endif %} · MilkTeaShop{% endblock %}

{% block content %}
<h1>{% if product %}编辑商品{% else %}新增商品{% endif %}</h1>

<form method="post"
      action="{% if product %}{{ url_for('product.update_product', product_id=product.product_id) }}{% else %}{{ url_for('product.create_product') }}{% endif %}"
      class="form">
  <label>商品名
    <input name="name" maxlength="100" required value="{{ product.name if product else '' }}">
  </label>
  <label>杯型
    <select name="size" required>
      {% for s in ['SMALL', 'MEDIUM', 'LARGE'] %}
        <option value="{{ s }}" {% if product and product.size == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>售价
    <input name="unit_price" type="number" min="0.01" step="0.01" required
           value="{{ product.unit_price if product else '' }}">
  </label>
  <label>销售状态
    <select name="sale_status">
      <option value="ON_SALE" {% if product and product.sale_status == 'ON_SALE' %}selected{% endif %}>在售</option>
      <option value="OFF_SHELF" {% if product and product.sale_status == 'OFF_SHELF' %}selected{% endif %}>已下架</option>
    </select>
  </label>
  <button class="btn primary" type="submit">保存</button>
</form>

<p><a class="btn" href="{{ url_for('product.list_products') }}">返回列表</a></p>
{% endblock %}
